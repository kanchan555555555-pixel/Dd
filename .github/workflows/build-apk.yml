name: Build Hotspot Arcade APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          set +o pipefail
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
            sudo chown -R "$USER:$USER" "$SDK_ROOT" || true
          else
            SDK_ROOT="${{ github.workspace }}/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
          fi

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          EXTRA_PKGS=$("$SDKMGR" --sdk_root="$SDK_ROOT" --list 2>/dev/null | grep -oE 'platforms;android-36[^[:space:]|]*|build-tools;36[^[:space:]|]*' | sort -u | tr '\n' ' ')
          if [ -n "$EXTRA_PKGS" ]; then
            echo "Installing Android 36 packages: $EXTRA_PKGS"
            "$SDKMGR" --sdk_root="$SDK_ROOT" --install $EXTRA_PKGS || true
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Hotspot Arcade APK
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-arcade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
